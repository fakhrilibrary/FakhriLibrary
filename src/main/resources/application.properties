spring.application.name=fakhri-library-backend

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.aqmzamwsycerfcgotyju
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Cloudinary
cloudinary.cloud-name=fakhrilib12
cloudinary.api-key=686779384521577
cloudinary.api-secret=${CLOUD_SECRET}

# Hikari
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Admin credentials
admin.username=admin
admin.password=${ADMIN_PASSWORD}

# Login rate limit
login.rate-limit.capacity=5
login.rate-limit.refill-minutes=1